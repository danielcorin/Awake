name: Awake

# XcodeGen spec. This YAML is the source of truth for the Xcode project;
# the generated .xcodeproj is disposable (git-ignored). Regenerate with:
#   mise exec -- xcodegen generate

options:
  postGenCommand: scripts/prepare-xcode.sh Awake.xcodeproj
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Project-level signing config lives in an xcconfig so a real Team ID and
# bundle id can stay in the git-ignored Configuration/Local.xcconfig.
configFiles:
  Debug: Configuration/Shared.xcconfig
  Release: Configuration/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_CODE_COVERAGE: "NO"
    CLANG_COVERAGE_MAPPING: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: "YES"      # required for notarization
    GENERATE_INFOPLIST_FILE: "YES"
    DEAD_CODE_STRIPPING: "YES"
    # The app embeds the companion CLI after it is built. Xcode's user-script
    # sandbox blocks ditto's temporary staging file on incremental builds.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Release:
      # Installed apps and helpers must not contain LLVM profile writers.
      ENABLE_CODE_COVERAGE: "NO"
      CLANG_COVERAGE_MAPPING: "NO"

packages:
  AppAutomation:
    path: Packages/AppAutomation
  TOML:
    url: https://github.com/mattt/swift-toml.git
    exactVersion: 2.0.0

targets:
  AwakeCore:
    type: library.static
    preBuildScripts:
      - name: Check generated API
        script: |
          "${SRCROOT}/scripts/check-generated.sh" --quick
          python3 "${SRCROOT}/scripts/check-ui-boundary.py"
        basedOnDependencyAnalysis: false
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Shared
    settings:
      base:
        PRODUCT_NAME: AwakeCore
        DEFINES_MODULE: YES
    dependencies:
      - package: AppAutomation
        product: AutomationRuntime
        link: false
      - package: TOML
        # Static-library targets do not link package products by default in
        # XcodeGen; Core imports TOML, so make this dependency explicit.
        link: true

  Awake:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: AwakeCore
      - package: AppAutomation
        product: AutomationRuntime
      - target: AwakeCLI
        embed: false
    settings:
      base:
        PRODUCT_NAME: Awake
        COMBINE_HIDPI_IMAGES: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"         # Awake lives in the menu bar, not the Dock
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    postBuildScripts:
      - name: Embed Awake CLI
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          ditto "${BUILT_PRODUCTS_DIR}/awake" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/awake"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/awake"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/awake"
    entitlements:
      path: App.entitlements
      properties:
        # The companion CLI and app communicate through a user-only Unix socket
        # in ~/Library/Application Support. Use App Group/XPC IPC before enabling
        # App Sandbox for a future Mac App Store build.
        com.apple.security.app-sandbox: false

  AwakeCLI:
    type: tool
    platform: macOS
    sources:
      - Sources/CLI
      - Sources/HTTP
    dependencies:
      - package: AppAutomation
        product: AutomationCLI
      - package: AppAutomation
        product: AutomationHTTP
      - target: AwakeCore
      - package: AppAutomation
        product: AutomationRuntime
    settings:
      base:
        PRODUCT_NAME: awake
        PRODUCT_MODULE_NAME: AwakeCommand
        # The executable ships inside the app. Installing a second archive
        # product beside the app would create a generic, non-exportable archive.
        SKIP_INSTALL: "YES"

  AwakeAutomationFixture:
    type: tool
    platform: macOS
    sources:
      - TestsSupport
    dependencies:
      - target: AwakeCore
      - package: AppAutomation
        product: AutomationRuntime
    settings:
      base:
        SKIP_INSTALL: "YES"

  AwakeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - TestsSupport/ScenarioSuite.swift
    dependencies:
      - target: AwakeCore
      - package: AppAutomation
        product: AutomationRuntime

schemes:
  AwakeAutomationFixture:
    build:
      targets:
        AwakeAutomationFixture: all

  Awake:
    build:
      targets:
        Awake: all
        AwakeCLI: all
        AwakeCore: all
        AwakeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Opt in only for isolated test builds with -enableCodeCoverage YES.
      gatherCoverageData: false
      targets:
        - AwakeTests
    archive:
      config: Release

  AwakeCLI:
    build:
      targets:
        AwakeCLI: all
        AwakeCore: all
    run:
      config: Debug
    archive:
      config: Release
