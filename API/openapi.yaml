  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "AppConfigurationValue": {
        "anyOf": [
          {
            "type": "boolean"
          },
          {
            "type": "string"
          },
          {
            "type": "integer"
          }
        ]
      },
      "Message": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ],
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "details": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        },
        "required": [
          "code",
          "message"
        ],
        "additionalProperties": false
      },
      "ErrorResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "error": {
            "$ref": "#/components/schemas/Error"
          }
        },
        "required": [
          "error"
        ],
        "additionalProperties": false
      },
      "AppConfigurationEntry": {
        "type": "object",
        "properties": {
          "key": {
            "$ref": "#/components/schemas/AppConfigurationKey"
          },
          "value": {
            "$ref": "#/components/schemas/AppConfigurationValue"
          },
          "source": {
            "$ref": "#/components/schemas/AppConfigurationSource"
          },
          "documentation": {
            "type": "string"
          }
        },
        "required": [
          "key",
          "value",
          "source",
          "documentation"
        ]
      },
      "AppConfigurationKey": {
        "type": "string",
        "enum": [
          "prevent-system-sleep",
          "keep-display-on",
          "prevent-disk-idle",
          "default-duration-minutes",
          "activate-at-launch",
          "show-welcome-message",
          "api-host",
          "api-port"
        ]
      },
      "WakeAssertions": {
        "type": "object",
        "description": "The three power assertions Awake can hold.",
        "properties": {
          "preventSystemSleep": {
            "type": "boolean",
            "description": "Hold PreventUserIdleSystemSleep so the Mac does not idle-sleep."
          },
          "keepDisplayOn": {
            "type": "boolean",
            "description": "Hold PreventUserIdleDisplaySleep so the display stays lit and the screen saver does not start."
          },
          "preventDiskIdle": {
            "type": "boolean",
            "description": "Hold PreventDiskIdle so disks are not spun down while idle."
          }
        },
        "required": [
          "preventSystemSleep",
          "keepDisplayOn",
          "preventDiskIdle"
        ],
        "additionalProperties": false
      },
      "WakeState": {
        "type": "object",
        "properties": {
          "active": {
            "type": "boolean",
            "description": "Whether Awake currently holds any power assertion."
          },
          "assertions": {
            "$ref": "#/components/schemas/WakeAssertions"
          },
          "defaults": {
            "$ref": "#/components/schemas/WakeAssertions"
          },
          "durationMinutes": {
            "type": "integer",
            "description": "Length of the active session in minutes; zero means indefinite. Absent when inactive."
          },
          "startedAt": {
            "type": "string",
            "description": "ISO 8601 start time of the active session. Absent when inactive."
          },
          "expiresAt": {
            "type": "string",
            "description": "ISO 8601 expiry of a timed session. Absent when inactive or indefinite."
          },
          "remainingSeconds": {
            "type": "integer",
            "description": "Seconds left in a timed session. Absent when inactive or indefinite."
          }
        },
        "required": [
          "active",
          "assertions",
          "defaults"
        ],
        "additionalProperties": false
      },
      "WakeStateResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/WakeState"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "WakeOnBody": {
        "type": "object",
        "description": "Each omitted assertion falls back to its configured default.",
        "properties": {
          "preventSystemSleep": {
            "type": "boolean"
          },
          "keepDisplayOn": {
            "type": "boolean"
          },
          "preventDiskIdle": {
            "type": "boolean"
          },
          "durationMinutes": {
            "type": "integer",
            "description": "Session length in minutes, 0 through 1440; zero means indefinite. Omitted uses default-duration-minutes."
          }
        },
        "required": [],
        "additionalProperties": false
      },
      "AppConfigurationSource": {
        "type": "string",
        "enum": [
          "defaults",
          "user"
        ]
      },
      "ConfigurationReport": {
        "type": "object",
        "properties": {
          "path": {
            "type": "string"
          },
          "entries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AppConfigurationEntry"
            }
          }
        },
        "required": [
          "path",
          "entries"
        ],
        "additionalProperties": false
      },
      "ValidationReport": {
        "type": "object",
        "properties": {
          "valid": {
            "type": "boolean"
          }
        },
        "required": [
          "valid"
        ],
        "additionalProperties": false
      },
      "AppStatus": {
        "type": "object",
        "properties": {
          "appName": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "processIdentifier": {
            "type": "integer"
          },
          "isFrontmost": {
            "type": "boolean"
          }
        },
        "required": [
          "appName",
          "version",
          "processIdentifier",
          "isFrontmost"
        ]
      },
      "StatusResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/AppStatus"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ShowResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/Message"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "QuitResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/Message"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigListResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/ConfigurationReport"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigGetResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/AppConfigurationEntry"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigSetResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/AppConfigurationEntry"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigSetBody": {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ],
        "additionalProperties": false
      },
      "ConfigUnsetResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/AppConfigurationEntry"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigReloadResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/ValidationReport"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigValidateResult": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/ValidationReport"
          }
        },
        "required": [
          "requestId",
          "data"
        ],
        "additionalProperties": false
      },
      "ConfigValidateBody": {
        "type": "object",
        "properties": {
          "content": {
            "type": "string"
          }
        },
        "required": [],
        "additionalProperties": false
      }
    }
  }
}
