      "put": {
        "operationId": "configSet",
        "summary": "Config set",
        "x-cli": {
          "command": [
            "config",
            "set"
          ],
          "bindings": {
            "path.key": {
              "argument": 0
            },
            "body.value": {
              "option": "--value"
            }
          }
        },
        "responses": {
          "200": {
