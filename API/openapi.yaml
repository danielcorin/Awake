              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResult"
                }
              }
            }
          }
        },
        "x-capabilities": [
          "running-app"
        ]
      }
    },
    "/v1/configuration": {
      "get": {
        "operationId": "configList",
        "summary": "Config list",
        "x-cli": {
          "command": [
