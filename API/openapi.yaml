    "/v1/wake": {
      "get": {
        "operationId": "wakeState",
        "summary": "Report the current wake session",
        "x-cli": {
          "command": [
            "state"
          ],
          "bindings": {}
        },
        "responses": {
          "200": {
            "description": "Operation completed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WakeStateResult"
                }
              }
            }
          },
          "default": {
            "description": "Operation failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResult"
                }
              }
            }
          }
        },
        "x-capabilities": [
          "running-app"
        ]
      },
      "post": {
        "operationId": "wakeOn",
        "summary": "Start keeping the Mac awake",
        "x-cli": {
          "command": [
            "on"
          ],
          "bindings": {
            "body.preventSystemSleep": {
              "option": "--system"
            },
            "body.keepDisplayOn": {
              "option": "--display"
            },
            "body.preventDiskIdle": {
              "option": "--disk"
            },
            "body.durationMinutes": {
              "option": "--minutes"
            }
          }
        },
        "responses": {
          "200": {
            "description": "Operation completed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WakeStateResult"
                }
              }
            }
          },
          "default": {
            "description": "Operation failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResult"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WakeOnBody"
              }
            }
          }
        },
        "x-capabilities": [
          "running-app"
        ]
      },
      "delete": {
        "operationId": "wakeOff",
        "summary": "Stop keeping the Mac awake",
        "x-cli": {
          "command": [
            "off"
          ],
          "bindings": {}
        },
        "responses": {
          "200": {
            "description": "Operation completed",
